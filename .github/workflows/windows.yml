# Builds the Windows version (64-bit) and uploads it to a GitHub Release.
# Manual only (Actions tab); release.yml builds every platform, so this must not
# also fire on branch pushes.
name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download soundfont assets
        run: npm run assets

      - name: Package Windows build (embeds icon, win32 x64)
        run: >
          npx electron-packager . OpenStudio
          --platform=win32 --arch=x64
          --out=dist --overwrite
          --icon=build/openstudio.ico

      - name: Determine version for the zip name
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $ver = "v$(node -p "require('./package.json').version")"
          }
          "zip=OpenStudio-win64-$ver.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/OpenStudio-win32-x64 -DestinationPath "dist/${{ steps.version.outputs.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenStudio-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "OpenStudio ${{ github.ref_name }}"
          --notes "OpenStudio ${{ github.ref_name }} - Windows 64-bit portable build. Unzip and run OpenStudio.exe. Not code-signed, so SmartScreen may ask you to run it anyway."
          --draft
          "dist/${{ steps.version.outputs.zip }}"
