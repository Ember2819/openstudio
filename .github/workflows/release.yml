name: Release builds
description: >-
  Builds distributable OpenStudio packages for x64 and ARM64. Windows produces
  standalone portable .exe files, Linux .AppImage files, and macOS .dmg files.
# Releases are cut deliberately, not on every commit. To publish one:
#   1. bump "version" in package.json and commit it
#   2. git tag v<version> && git push origin v<version>
# That builds all six packages (3 platforms x 2 architectures) and publishes
# them as a GitHub Release, e.g. OpenStudio-0.3.0-windows-x64-portable.exe.
# Pushes to main without a tag only run CI (ci.yml).
#
# "Run workflow" in the Actions tab does a test build of the current branch:
# the packages are uploaded as workflow artifacts but no release is created.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create GitHub releases

concurrency:
  group: release-builds
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # standalone portable .exe
          - os: ubuntu-latest # .AppImage
          - os: macos-latest # .dmg (unsigned)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($pkg). Bump the version first."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Fetch checksum-verified audio assets
        run: npm run assets

      - name: Run unit tests
        run: npm test

      - name: Stamp build number
        # lets the installed app compare itself with the newest release (see updater.js)
        run: node scripts/stamp-build.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Package distributable(s)
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing; the .dmg is left unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Splice in the FUSE-free static AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder's AppImage runtime dlopen()s libfuse.so.2, which
          # modern distros don't ship by default, so a downloaded AppImage
          # fails to launch out of the box. Splice in the official statically
          # linked runtime (libfuse2 compiled in) instead; the squashfs
          # payload is untouched.
          pin=20251108
          base="https://github.com/AppImage/type2-runtime/releases/download/${pin}"
          mkdir -p runtime
          curl -fsSL -o runtime/runtime-x86_64 "$base/runtime-x86_64"
          curl -fsSL -o runtime/runtime-aarch64 "$base/runtime-aarch64"
          chmod +x runtime/runtime-*
          for f in release/*.AppImage; do
            case "$f" in
              *x86_64*) arch=x86_64 ;;
              *arm64*) arch=aarch64 ;;
              *) echo "Unknown architecture in $f" >&2; exit 1 ;;
            esac
            node scripts/repack-appimage.mjs "$f" "runtime/runtime-${arch}"
          done

      - name: Normalize Linux architecture suffix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder emits "x86_64" for Linux; normalize to "x64" so
          # artifact names are consistent across all platforms
          for f in release/*x86_64*; do
            mv "$f" "${f/x86_64/x64}"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # package.json needed for the version

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openstudio-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenStudio ${{ github.ref_name }}
          generate_release_notes: true
          body: >-
            Downloads:
            OpenStudio-${{ steps.ver.outputs.version }}-windows-x64-portable.exe (Windows x64),
            OpenStudio-${{ steps.ver.outputs.version }}-windows-arm64-portable.exe (Windows on ARM),
            OpenStudio-${{ steps.ver.outputs.version }}-linux-x64.AppImage (Linux x64),
            OpenStudio-${{ steps.ver.outputs.version }}-linux-arm64.AppImage (Linux ARM64),
            OpenStudio-${{ steps.ver.outputs.version }}-macos-x64.dmg (Intel Macs) and
            OpenStudio-${{ steps.ver.outputs.version }}-macos-arm64.dmg (Apple Silicon).
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
