name: Release builds
description: >-
  Builds distributable OpenStudio packages for x64 and ARM64. Windows produces
  standalone portable .exe files, Linux .AppImage files, and macOS .dmg files.
# For every push (also merged PR) to main all six builds (3 platforms x 2
# architectures) will be rebuilt and published to GitHub Releases as a new
# release containing all artifacts, e.g.
# OpenStudio-0.2.0-windows-x64-portable.exe

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual test run from the Actions tab

permissions:
  contents: write # required to create GitHub releases

concurrency:
  group: release-builds-main
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # standalone portable .exe
          - os: ubuntu-latest # .AppImage
          - os: macos-latest # .dmg (unsigned)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch checksum-verified audio assets
        run: npm run assets

      - name: Run unit tests
        run: npm test

      - name: Stamp build number
        # lets the installed app compare itself with the newest release (see updater.js)
        run: node scripts/stamp-build.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Package distributable(s)
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing; the .dmg is left unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Normalize Linux architecture suffix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder emits "x86_64" for Linux; normalize to "x64" so
          # artifact names are consistent across all platforms
          for f in release/*x86_64*; do
            mv "$f" "${f/x86_64/x64}"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # package.json needed for the version

      - name: Compute version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openstudio-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          name: OpenStudio v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: >-
            Automated build from commit ${{ github.sha }}.
            Downloads:
            OpenStudio-${{ steps.ver.outputs.version }}-windows-x64-portable.exe (Windows x64),
            OpenStudio-${{ steps.ver.outputs.version }}-windows-arm64-portable.exe (Windows on ARM),
            OpenStudio-${{ steps.ver.outputs.version }}-linux-x64.AppImage (Linux x64),
            OpenStudio-${{ steps.ver.outputs.version }}-linux-arm64.AppImage (Linux ARM64),
            OpenStudio-${{ steps.ver.outputs.version }}-macos-x64.dmg (Intel Macs) and
            OpenStudio-${{ steps.ver.outputs.version }}-macos-arm64.dmg (Apple Silicon).
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
