name: Release builds
description: >-
  Builds distributable OpenStudio packages for x64 and ARM64. Windows produces
  standalone portable .exe files, Linux .AppImage files, and macOS .dmg files.
# Manual only ("Run workflow" in the Actions tab) — releases are never created
# automatically, not on branch or tag pushes. This does a test build of the
# current branch; the packages are uploaded as workflow artifacts and can be
# published to the releases page by hand if wanted.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # standalone portable .exe
          - os: ubuntu-latest # .AppImage
          - os: macos-latest # .dmg (unsigned)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch checksum-verified audio assets
        run: npm run assets

      - name: Run unit tests
        run: npm test

      - name: Stamp build number
        # lets the installed app compare itself with the newest release (see updater.js)
        run: node scripts/stamp-build.mjs
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Package distributable(s)
        run: npx electron-builder --publish never
        env:
          # Skip macOS code-signing; the .dmg is left unsigned
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Splice in the FUSE-free static AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder's AppImage runtime dlopen()s libfuse.so.2, which
          # modern distros don't ship by default, so a downloaded AppImage
          # fails to launch out of the box. Splice in the official statically
          # linked runtime (libfuse2 compiled in) instead; the squashfs
          # payload is untouched.
          pin=20251108
          base="https://github.com/AppImage/type2-runtime/releases/download/${pin}"
          mkdir -p runtime
          curl -fsSL -o runtime/runtime-x86_64 "$base/runtime-x86_64"
          curl -fsSL -o runtime/runtime-aarch64 "$base/runtime-aarch64"
          chmod +x runtime/runtime-*
          for f in release/*.AppImage; do
            case "$f" in
              *x86_64*) arch=x86_64 ;;
              *arm64*) arch=aarch64 ;;
              *) echo "Unknown architecture in $f" >&2; exit 1 ;;
            esac
            node scripts/repack-appimage.mjs "$f" "runtime/runtime-${arch}"
          done

      - name: Normalize Linux architecture suffix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # electron-builder names deb packages "amd64" and rpm packages
          # "x86_64"/"aarch64"; normalize to "x64"/"arm64" so artifact names
          # are consistent across all platforms and package formats
          shopt -s nullglob
          for f in release/*x86_64*; do mv "$f" "${f/x86_64/x64}"; done
          for f in release/*amd64*; do mv "$f" "${f/amd64/x64}"; done
          for f in release/*aarch64*; do mv "$f" "${f/aarch64/arm64}"; done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstudio-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
          if-no-files-found: error
