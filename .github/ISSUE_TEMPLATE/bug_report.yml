name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the demo project (File → Open demo project)
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenStudio version / commit
  - type: input
    id: os
    attributes:
      label: Operating system and audio device
      placeholder: e.g. Arch Linux (PipeWire), Windows 11, macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Console output / project file
      description: Open DevTools with Ctrl+Shift+I and paste errors. Attach a minimal `.osp` project if relevant.
