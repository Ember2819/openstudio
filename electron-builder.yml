# electron-builder configuration — the release.yml workflow invokes
# `npx electron-builder` which picks this file up automatically.
appId: dev.openstudio.app
productName: OpenStudio
directories:
  output: release
  buildResources: build

# Only ship what the app needs at runtime
files:
  - main.js
  - preload.js
  - mcp/**/*
  - updater.js
  - buildinfo.json
  - index.html
  - src/**/*
  - styles/**/*
  - assets/**/*
  - package.json
  - '!**/*.map'
  - '!test/**'
  - '!docs/**'
  - '!scripts/**'
  - '!build/**'
  - '!release/**'

# Descriptive artifact names: <Name>-<version>-<platform>-<arch>[...].<ext>
# e.g. OpenStudio-0.2.0-windows-x64-portable.exe
#      OpenStudio-0.2.0-linux-x64.AppImage
#      OpenStudio-0.2.0-macos-arm64.dmg

mac:
  # Unsigned build — no Apple Developer account available
  identity: null
  # arm64 is the native runner arch; x64 is included for Intel Macs
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: OpenStudio records audio from your microphone or audio interface when you arm audio recording.

win:
  target:
    - target: portable
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}
  icon: build/openstudio.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
